<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="rclone-backupのプライバシーポリシーです。">
  <title>プライバシーポリシー | rclone-backup</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f7fa; color: #243245; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; line-height: 1.9; }
    main { width: min(100% - 40px, 720px); margin: 64px auto; padding: clamp(24px, 5vw, 48px); background: #fff; border: 1px solid #dce4ec; border-radius: 16px; }
    h1 { margin: 0 0 24px; font-size: clamp(1.7rem, 5vw, 2.2rem); line-height: 1.4; overflow-wrap: anywhere; }
    p { margin: 0 0 20px; }
    nav { margin-top: 32px; padding-top: 24px; border-top: 1px solid #dce4ec; }
    a { color: #174c94; text-underline-offset: 4px; }
    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible { outline: 3px solid #174c94; outline-offset: 5px; border-radius: 2px; }
    @media (max-width: 480px) { main { margin: 24px auto; } }
  </style>
</head>
<body>
  <main>
    <h1>プライバシーポリシー</h1>
    <p>本アプリ（rclone-backup）は、作成者本人が自分のファイルを自分のGoogleドライブへバックアップする目的でのみ使用します。</p>
    <p>バックアップに必要なデータは、本人が指定したGoogleドライブへ送信します。バックアップ以外の目的で第三者に提供したり、広告に利用したりすることはありません。</p>
    <p>アクセス権の取り消しは、Googleアカウントの「サードパーティのアプリとサービス」からいつでも行えます。</p>
    <nav aria-label="関連ページ">
      <a href="index.html">rclone-backupのトップページへ</a>
    </nav>
  </main>
</body>
</html>
